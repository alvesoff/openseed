<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Foto de perfil do Instagram (template)</title>
<!-- Template da foto de perfil. Não é página do site.

     Receita:
     1. Sirva o repositório numa porta qualquer e abra este arquivo. O SVG da
        marca fica em tools/marca/, ao lado dele. Por file:// a fonte do
        Google Fonts não carrega e o quadro sai com a fonte errada.
     2. Fotografe #perfil e salve em
        tools/marca/openseed-instagram-perfil.png.
     3. Confira: 1080 por 1080. Antes de fotografar, apague a classe "guia",
        senão o círculo tracejado entra na imagem.

     Por que 1080: o Instagram aceita e reamostra para baixo. Subir menor faz
     a foto chegar borrada no celular de tela densa.

     Por que a marca ocupa 76% e não a largura toda: o Instagram recorta em
     círculo, e os cantos do quadrado somem. O guia mostra o círculo visível;
     nada da marca pode encostar nele. -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #1c1c1c; color: #7e7e77;
    font: 12px/1.6 ui-monospace, Consolas, monospace; letter-spacing: .08em;
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px; padding: 48px;
  }
  figure { margin: 0; display: grid; gap: 12px; justify-items: center; }

  .tile {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    display: grid; place-items: center;
    position: relative; overflow: hidden;
  }
  .tile img { width: 76%; height: auto; display: block; }

  /* Círculo que o Instagram deixa visível. Some antes de fotografar. */
  .guia::after {
    content: ""; position: absolute; inset: 0;
    border: 2px dashed rgba(198, 242, 78, .35); border-radius: 50%;
  }

  /* Como fica de verdade: os dois tamanhos em que o Instagram mostra a foto,
     já recortados em círculo. Só para conferir a olho, não é para exportar. */
  .provas { display: flex; align-items: flex-end; gap: 28px; }
  .prova { display: grid; gap: 8px; justify-items: center; }
  .prova span { font-size: 11px; }
  .redondo { border-radius: 50%; overflow: hidden; display: block; }
  .r110 { width: 110px; height: 110px; }
  .r56 { width: 56px; height: 56px; }
  .r32 { width: 32px; height: 32px; }
  .redondo img { width: 76%; }
  .redondo-fundo { background: #0a0a0a; display: grid; place-items: center; width: 100%; height: 100%; }
</style>
</head>
<body>
  <figure>
    <div class="tile guia" id="perfil">
      <img src="marca/openseed-marca.svg" alt="">
    </div>
    <figcaption>openseed-instagram-perfil.png · 1080x1080 · tire a classe guia antes</figcaption>
  </figure>

  <figure>
    <div class="provas">
      <div class="prova">
        <div class="redondo r110"><div class="redondo-fundo"><img src="marca/openseed-marca.svg" alt=""></div></div>
        <span>110 px<br>perfil</span>
      </div>
      <div class="prova">
        <div class="redondo r56"><div class="redondo-fundo"><img src="marca/openseed-marca.svg" alt=""></div></div>
        <span>56 px<br>stories</span>
      </div>
      <div class="prova">
        <div class="redondo r32"><div class="redondo-fundo"><img src="marca/openseed-marca.svg" alt=""></div></div>
        <span>32 px<br>comentário</span>
      </div>
    </div>
    <figcaption>como o Instagram mostra, já em círculo</figcaption>
  </figure>
</body>
</html>
