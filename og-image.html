<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Inter:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 500px at 18% -10%, rgba(86,200,132,0.16), transparent 60%),
      #0a0b09;
    color: #f2f0e9;
    font-family: "Inter", system-ui, sans-serif;
    padding: 76px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Bricolage Grotesque", "Inter", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.025em; }
  .brand svg { width: auto; height: 38px; }
  h1 {
    font-family: "Unbounded", sans-serif;
    font-weight: 600;
    font-size: 78px;
    line-height: 1.18;
    letter-spacing: -0.01em;
    max-width: 1000px;
  }
  h1 em { font-style: normal; color: #56c884; }
  .tag { font-size: 26px; color: #9a9b92; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="9.4 10 14.6 18.8" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 24.4C16 20.4 15.6 16.6 16 12.6" stroke="#f2f0e9" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M16 18.2C20.1 17.6 23.4 14.6 24 10C19.5 10.6 16.5 13.7 16 18.2Z" fill="#f2f0e9"/>
      <path d="M15.6 21C12.4 20.5 9.9 18.1 9.4 14.5C12.9 15 15.2 17.5 15.6 21Z" fill="#f2f0e9"/>
      <ellipse cx="16" cy="26.2" rx="4.6" ry="2.6" fill="#f2f0e9"/>
    </svg>
    OpenSeed
  </div>

  <h1>Toda revolução começou com uma <em>Seed</em>.</h1>

  <div class="tag">Soluções com IA que facilitam a vida das pessoas.</div>
</body>
</html>
